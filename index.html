<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="cash flow（仮）は、家計簿とサブスクリプション管理をひとつにまとめた上質なWebアプリです。"
    />
    <title>cash flow（仮）</title>
    <style>
      :root {
        color: #1d1d1f;
        background: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --text-muted: #6e6e73;
        --panel: rgba(255, 255, 255, 0.82);
        --line: rgba(29, 29, 31, 0.1);
        --blue: #0071e3;
        --green: #34c759;
        --orange: #ff9f0a;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.1);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; min-width: 320px; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }

      .app-shell { overflow: hidden; }
      .hero {
        min-height: 760px;
        padding: 24px clamp(20px, 5vw, 72px) 72px;
        background:
          radial-gradient(circle at 80% 10%, rgba(0, 113, 227, 0.2), transparent 28%),
          radial-gradient(circle at 20% 30%, rgba(52, 199, 89, 0.14), transparent 30%),
          linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 72%, #ffffff 100%);
      }

      .topbar, .hero__grid, main { max-width: 1180px; margin: 0 auto; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 12px 0;
      }
      .brand, .topbar__links { display: flex; align-items: center; gap: 18px; }
      .brand { font-weight: 700; letter-spacing: -0.03em; }
      .brand small { color: var(--text-muted); font-weight: 600; }
      .brand__mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: #1d1d1f;
        color: #fff;
      }
      .brand__mark svg, .metric__icon svg, .transaction__icon svg { width: 18px; height: 18px; }
      .topbar__links { color: var(--text-muted); font-size: 0.92rem; }

      .hero__grid {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(330px, 0.72fr);
        gap: clamp(28px, 6vw, 80px);
        align-items: center;
        padding-top: 96px;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--blue);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1, h2, h3, p { margin-top: 0; }
      h1 { max-width: 760px; font-size: clamp(3.3rem, 8vw, 7.2rem); line-height: 0.92; letter-spacing: -0.075em; margin-bottom: 28px; }
      h2 { font-size: clamp(1.6rem, 3vw, 2.6rem); letter-spacing: -0.055em; margin-bottom: 0; }
      h3 { font-size: 1.35rem; letter-spacing: -0.04em; }
      .hero__lead { max-width: 650px; color: var(--text-muted); font-size: 1.15rem; line-height: 1.85; }
      .hero__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      .button, .text-button {
        border: 0;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; border-radius: 999px; font-weight: 700; }
      .button:hover, .text-button:hover { transform: translateY(-1px); }
      .button--primary { background: var(--blue); color: #fff; box-shadow: 0 14px 30px rgba(0, 113, 227, 0.22); }
      .button--ghost { background: rgba(255, 255, 255, 0.74); color: #1d1d1f; border: 1px solid var(--line); }
      .button--dark { background: #1d1d1f; color: #fff; }
      .text-button { background: transparent; color: var(--blue); font-weight: 700; }

      .card {
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 34px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: clamp(22px, 3vw, 34px);
        backdrop-filter: blur(28px) saturate(170%);
      }
      .card--glass { background: rgba(255, 255, 255, 0.58); }
      .card--dark { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
      .balance-card { min-height: 430px; display: flex; flex-direction: column; justify-content: center; }
      .balance-card__top, .balance-card__meta, .section-heading, .subscription-card__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .balance-card__top { color: var(--text-muted); font-weight: 700; }
      .balance-card__top svg { width: 24px; height: 24px; }
      .balance-card strong { display: block; margin: 28px 0 18px; font-size: clamp(2.4rem, 6vw, 4.4rem); letter-spacing: -0.07em; }
      .balance-card__meta { color: var(--text-muted); font-size: 0.95rem; }
      .progress { height: 9px; margin: 28px 0 18px; overflow: hidden; border-radius: 999px; background: rgba(29, 29, 31, 0.08); }
      .progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); }
      .balance-card p { color: var(--text-muted); line-height: 1.7; margin-bottom: 0; }

      main { padding: 0 clamp(20px, 5vw, 72px) 80px; }
      .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: -42px; }
      .metric { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; padding: 20px; border-radius: 26px; background: #fff; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08); }
      .metric__icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 18px; color: var(--blue); background: rgba(0, 113, 227, 0.1); }
      .metric--positive .metric__icon { color: var(--green); background: rgba(52, 199, 89, 0.12); }
      .metric--warning .metric__icon { color: var(--orange); background: rgba(255, 159, 10, 0.12); }
      .metric p, .metric span { margin: 0; color: var(--text-muted); font-size: 0.86rem; }
      .metric strong { display: block; margin: 2px 0; font-size: 1.45rem; letter-spacing: -0.05em; }

      .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr); gap: 20px; margin-top: 48px; }
      .section-heading { margin-bottom: 28px; }
      .section-heading--compact { margin-bottom: 18px; }
      .section-heading--center { max-width: 760px; margin: 0 auto 30px; text-align: center; flex-direction: column; }
      .section-heading--center p:last-child { color: var(--text-muted); line-height: 1.7; }
      .trend-chart { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; gap: 16px; height: 280px; padding-top: 12px; }
      .trend-chart__item { display: grid; grid-template-rows: 1fr auto; gap: 10px; height: 100%; text-align: center; color: var(--text-muted); }
      .trend-chart__item span { align-self: end; border-radius: 999px 999px 12px 12px; background: linear-gradient(180deg, #1d1d1f, #8e8e93); min-height: 42px; }
      .category-list, .transaction-list { display: grid; gap: 12px; }
      .category-row, .transaction { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px; border-radius: 20px; background: rgba(245, 245, 247, 0.86); }
      .category-row div { display: grid; gap: 4px; }
      .category-row span, .transaction span, .subscription-card dt { color: var(--text-muted); font-size: 0.84rem; }
      .category-row p, .transaction p { margin: 0; font-weight: 800; letter-spacing: -0.03em; }
      .transaction { justify-content: flex-start; }
      .transaction__icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 16px; background: #fff; color: #1d1d1f; }
      .transaction div:nth-child(2) { flex: 1; display: grid; gap: 4px; }
      .amount-positive { color: var(--green); }

      .ad-band { margin: 22px 0 64px; }
      .ad-band__slot { display: grid; place-items: center; gap: 6px; padding: 18px; border: 1px dashed rgba(29, 29, 31, 0.18); border-radius: 28px; background: rgba(255,255,255,0.7); text-align: center; color: var(--text-muted); }
      .ad-band__slot span { color: #1d1d1f; font-weight: 800; }
      .ad-band__slot p { margin: 0; }

      .subscriptions, .billing { margin-top: 60px; }
      .subscription-grid, .plan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
      .subscription-card { box-shadow: 0 18px 55px rgba(0, 0, 0, 0.07); }
      .subscription-card__top { color: var(--text-muted); font-size: 0.8rem; }
      .subscription-card h3 { margin: 20px 0 8px; }
      .subscription-card > strong, .plan-grid strong { display: block; font-size: 1.75rem; letter-spacing: -0.055em; }
      .subscription-card dl { display: grid; gap: 10px; margin: 24px 0 0; }
      .subscription-card dl div { display: flex; justify-content: space-between; gap: 12px; }
      .subscription-card dd { margin: 0; text-align: right; }
      .status { padding: 5px 9px; border-radius: 999px; background: rgba(0, 113, 227, 0.09); color: var(--blue); font-weight: 700; }
      .status--review { background: rgba(255, 159, 10, 0.13); color: #b35f00; }
      .status--cancel-planned { background: rgba(255, 59, 48, 0.1); color: #c92a22; }
      .plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .plan-name { color: var(--blue); font-weight: 800; }
      .card--dark .plan-name { color: #8cc7ff; }
      .plan-grid p { color: var(--text-muted); line-height: 1.7; }
      .card--dark p { color: rgba(255, 255, 255, 0.72); }
      ul { padding-left: 20px; margin-bottom: 0; line-height: 2; }

      @media (max-width: 900px) {
        .hero { min-height: auto; padding-bottom: 56px; }
        .topbar__links { display: none; }
        .hero__grid, .dashboard-grid { grid-template-columns: 1fr; padding-top: 54px; }
        .metrics, .subscription-grid { grid-template-columns: 1fr 1fr; }
        .subscription-grid { gap: 14px; }
      }

      @media (max-width: 640px) {
        .hero { padding: 16px 16px 44px; }
        main { padding: 0 16px 56px; }
        h1 { font-size: clamp(3rem, 17vw, 4.6rem); }
        .hero__lead { font-size: 1rem; }
        .hero__actions, .section-heading, .balance-card__meta { align-items: stretch; flex-direction: column; }
        .button { width: 100%; }
        .card { border-radius: 28px; }
        .metrics, .subscription-grid, .plan-grid { grid-template-columns: 1fr; }
        .metrics { margin-top: 20px; }
        .trend-chart { height: 220px; gap: 10px; }
        .transaction { display: grid; grid-template-columns: 42px 1fr; }
        .transaction p { grid-column: 2; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const icons = {
        wallet: 'M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v10.5A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-10Zm13 5h3v4h-3a2 2 0 1 1 0-4ZM6.5 5A2.5 2.5 0 0 0 4 7.5h13',
        calendar: 'M7 3v4M17 3v4M4.5 9h15M6.5 5h11A2.5 2.5 0 0 1 20 7.5v10A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-10A2.5 2.5 0 0 1 6.5 5Z',
        chart: 'M5 19V5m0 14h14M8 15l3-3 2 2 5-7',
        spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z',
        shield: 'M12 3l7 3v5.5c0 4.2-2.8 7.2-7 8.5-4.2-1.3-7-4.3-7-8.5V6l7-3Z',
        card: 'M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Zm0 2.5h16',
      };
      const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="${icons[name]}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
      const currency = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 });
      const compactCurrency = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', notation: 'compact', maximumFractionDigits: 1 });
      const dateFormat = new Intl.DateTimeFormat('ja-JP', { month: 'short', day: 'numeric' });
      const monthlyBudget = { limit: 248000, targetSavings: 85000 };
      const transactions = [
        { id: 'tx-001', title: '給与', amount: 420000, type: 'income', category: 'salary', date: '2026-05-25' },
        { id: 'tx-002', title: '食料品', amount: 13200, type: 'expense', category: 'food', date: '2026-05-27' },
        { id: 'tx-003', title: '家賃', amount: 128000, type: 'expense', category: 'home', date: '2026-05-01' },
        { id: 'tx-004', title: '交通系IC', amount: 8000, type: 'expense', category: 'transport', date: '2026-05-18' },
        { id: 'tx-005', title: '映画と書籍', amount: 6200, type: 'expense', category: 'entertainment', date: '2026-05-20' },
      ];
      const spendingTrend = [
        { month: '1月', amount: 214000 },
        { month: '2月', amount: 226000 },
        { month: '3月', amount: 203000 },
        { month: '4月', amount: 238000 },
        { month: '5月', amount: 155400 },
      ];
      const subscriptions = [
        { id: 'sub-001', serviceName: 'iCloud+', amount: 400, cycle: 'monthly', renewalDate: '2026-06-02', paymentMethod: 'Apple Pay', status: 'active', category: 'Storage' },
        { id: 'sub-002', serviceName: 'Music Studio', amount: 1480, cycle: 'monthly', renewalDate: '2026-06-12', paymentMethod: 'Visa ending 1028', status: 'review', category: 'Creative' },
        { id: 'sub-003', serviceName: 'Design Library', amount: 12000, cycle: 'yearly', renewalDate: '2026-09-01', paymentMethod: 'Mastercard ending 4040', status: 'active', category: 'Work' },
        { id: 'sub-004', serviceName: 'Video Plus', amount: 990, cycle: 'monthly', renewalDate: '2026-06-20', paymentMethod: 'Apple Pay', status: 'cancel-planned', category: 'Entertainment' },
      ];
      const appPlans = [
        { id: 'free', name: 'Free', priceLabel: '¥0', description: '広告は控えめに、基本の家計簿とサブスク管理を提供します。', features: ['月次サマリー', 'サブスク一覧', '控えめな広告枠'] },
        { id: 'plus', name: 'Plus', priceLabel: '将来提供予定', description: '広告非表示、詳細分析、共有、ネイティブアプリ連携を想定した拡張プランです。', features: ['広告非表示', '高度な予算分析', '複数デバイス同期'] },
      ];
      const categoryLabels = { salary: '給与', food: '食費', transport: '交通', home: '住居', entertainment: '娯楽', health: '健康', education: '学習', other: 'その他' };
      const statusLabels = { active: '継続中', review: '見直し候補', 'cancel-planned': '解約予定' };
      const sumByType = (type) => transactions.filter((transaction) => transaction.type === type).reduce((total, transaction) => total + transaction.amount, 0);
      const getCategoryBreakdown = () => {
        const expenses = transactions.filter((transaction) => transaction.type === 'expense');
        const total = expenses.reduce((sum, transaction) => sum + transaction.amount, 0);
        const groups = expenses.reduce((acc, transaction) => ({ ...acc, [transaction.category]: (acc[transaction.category] || 0) + transaction.amount }), {});
        return Object.entries(groups).map(([category, amount]) => ({ category, amount, share: Math.round((amount / total) * 100) })).sort((a, b) => b.amount - a.amount);
      };
      const monthlySubscriptionCost = subscriptions.reduce((total, subscription) => total + (subscription.cycle === 'yearly' ? subscription.amount / 12 : subscription.amount), 0);
      const annualSubscriptionCost = subscriptions.reduce((total, subscription) => total + (subscription.cycle === 'monthly' ? subscription.amount * 12 : subscription.amount), 0);
      const metricCard = (label, value, helper, iconName, tone = 'neutral') => `<article class="metric metric--${tone}"><div class="metric__icon">${icon(iconName)}</div><div><p>${label}</p><strong>${value}</strong><span>${helper}</span></div></article>`;
      const income = sumByType('income');
      const expenses = sumByType('expense');
      const balance = income - expenses;
      const budgetUsage = Math.round((expenses / monthlyBudget.limit) * 100);
      const maxTrend = Math.max(...spendingTrend.map((trend) => trend.amount));

      document.getElementById('root').innerHTML = `
        <div class="app-shell">
          <header class="hero">
            <nav class="topbar" aria-label="メインナビゲーション">
              <a class="brand" href="#top" aria-label="cash flow ホーム"><span class="brand__mark">${icon('spark')}</span><span>cash flow <small>仮</small></span></a>
              <div class="topbar__links"><a href="#budget">家計簿</a><a href="#subscriptions">サブスク</a><a href="#billing">プラン</a></div>
            </nav>
            <div class="hero__grid" id="top">
              <div class="hero__copy">
                <p class="eyebrow">Budgeting and subscription care</p>
                <h1>毎月のお金を、静かに、美しく、迷わず整える。</h1>
                <p class="hero__lead">cash flow（仮）は、家計簿とサブスクリプション管理を一体化したWebアプリです。Apple製品のような明快さを参考に、入力・確認・見直しの流れを最短にします。</p>
                <div class="hero__actions"><a class="button button--primary" href="#budget">ダッシュボードを見る</a><a class="button button--ghost" href="#subscriptions">更新日を確認</a></div>
              </div>
              <section class="card card--glass balance-card">
                <div class="balance-card__top"><span>今月の残高</span>${icon('wallet')}</div>
                <strong>${currency.format(balance)}</strong>
                <div class="balance-card__meta"><span>収入 ${currency.format(income)}</span><span>支出 ${currency.format(expenses)}</span></div>
                <div class="progress" aria-label="予算使用率 ${budgetUsage}%"><span style="width: ${budgetUsage}%"></span></div>
                <p>予算上限の ${budgetUsage}% を使用。目標貯蓄まであと ${currency.format(monthlyBudget.targetSavings - balance)}。</p>
              </section>
            </div>
          </header>
          <main>
            <section class="metrics" aria-label="月次サマリー">
              ${metricCard('月間支出', currency.format(expenses), '固定費と変動費を合算', 'chart')}
              ${metricCard('サブスク月換算', currency.format(monthlySubscriptionCost), `年額 ${currency.format(annualSubscriptionCost)}`, 'calendar', 'warning')}
              ${metricCard('貯蓄余力', currency.format(balance), '今月の収入から支出を差引', 'shield', 'positive')}
            </section>
            <section class="dashboard-grid" id="budget">
              <section class="card panel-large">
                <div class="section-heading"><div><p class="eyebrow">Household ledger</p><h2>支出推移</h2></div><button class="text-button" type="button">取引を追加</button></div>
                <div class="trend-chart" aria-label="過去5か月の支出推移">${spendingTrend.map((trend) => `<div class="trend-chart__item"><span style="height: ${(trend.amount / maxTrend) * 100}%"></span><small>${trend.month}</small></div>`).join('')}</div>
              </section>
              <section class="card">
                <div class="section-heading section-heading--compact"><div><p class="eyebrow">Categories</p><h2>カテゴリ分類</h2></div></div>
                <div class="category-list">${getCategoryBreakdown().map((item) => `<div class="category-row"><div><strong>${categoryLabels[item.category]}</strong><span>${item.share}%</span></div><p>${currency.format(item.amount)}</p></div>`).join('')}</div>
              </section>
              <section class="card panel-large">
                <div class="section-heading"><div><p class="eyebrow">Transactions</p><h2>最近の入出金</h2></div><button class="text-button" type="button">CSV出力</button></div>
                <div class="transaction-list">${transactions.map((transaction) => `<article class="transaction"><div class="transaction__icon">${icon(transaction.type === 'income' ? 'wallet' : 'card')}</div><div><strong>${transaction.title}</strong><span>${categoryLabels[transaction.category]} · ${dateFormat.format(new Date(transaction.date))}</span></div><p class="${transaction.type === 'income' ? 'amount-positive' : ''}">${transaction.type === 'income' ? '+' : '-'}${currency.format(transaction.amount)}</p></article>`).join('')}</div>
              </section>
            </section>
            <section class="ad-band" aria-label="広告枠"><div class="ad-band__slot" style="min-height: 92px"><span>Sponsored insight</span><p>あなたの判断を邪魔しない、低頻度・小面積の広告配置を想定しています。</p></div></section>
            <section class="subscriptions" id="subscriptions">
              <div class="section-heading"><div><p class="eyebrow">Subscriptions</p><h2>更新前に、必要なものだけ残す。</h2></div><button class="button button--dark" type="button">サブスクを追加</button></div>
              <div class="subscription-grid">${subscriptions.map((subscription) => `<section class="card subscription-card"><div class="subscription-card__top"><span>${subscription.category}</span><span class="status status--${subscription.status}">${statusLabels[subscription.status]}</span></div><h3>${subscription.serviceName}</h3><strong>${subscription.cycle === 'yearly' ? `${compactCurrency.format(subscription.amount)} / 年` : `${currency.format(subscription.amount)} / 月`}</strong><dl><div><dt>更新日</dt><dd>${dateFormat.format(new Date(subscription.renewalDate))}</dd></div><div><dt>支払い</dt><dd>${subscription.paymentMethod}</dd></div></dl></section>`).join('')}</div>
            </section>
            <section class="billing" id="billing">
              <div class="section-heading section-heading--center"><p class="eyebrow">Monetization ready</p><h2>良心的な収益化を前提にした、ひとつの完成プラン。</h2><p>無料体験を壊さず、広告・有料機能・将来のネイティブアプリ連携を機能単位で拡張できます。</p></div>
              <div class="plan-grid">${appPlans.map((plan) => `<section class="card card--${plan.id === 'plus' ? 'dark' : 'default'}"><span class="plan-name">${plan.name}</span><strong>${plan.priceLabel}</strong><p>${plan.description}</p><ul>${plan.features.map((feature) => `<li>${feature}</li>`).join('')}</ul></section>`).join('')}</div>
            </section>
          </main>
        </div>
      `;
    </script>
  </body>
</html>
